<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>資金作成・進捗管理ツール</title>
  <!-- グラフ描画用ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --success: #10b981;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 16px;
      max-width: 500px;
      margin: 0 auto;
    }

    .header { text-align: center; margin-bottom: 12px; }
    .header h1 { font-size: 18px; font-weight: 700; }

    /* 使い方ガイド */
    .guide-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 12px;
      color: #1e40af;
    }
    .guide-title { font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
    .guide-steps { list-style: none; padding: 0; }
    .guide-steps li { margin-bottom: 3px; display: flex; align-items: center; gap: 6px; }
    .step-badge {
      background: var(--primary);
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 10px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    /* カウントダウン */
    .countdown-box {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #ffffff;
      text-align: center;
      border: none;
    }
    .countdown-title { font-size: 13px; color: #94a3b8; margin-bottom: 4px; }
    .countdown-days { font-size: 36px; font-weight: 800; color: #38bdf8; line-height: 1.2; }
    .countdown-days span { font-size: 16px; font-weight: 400; color: #ffffff; margin-left: 4px; }
    
    .setting-row {
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      color: #cbd5e1;
    }
    .setting-row input {
      background: #334155;
      border: 1px solid #475569;
      color: #ffffff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
    }

    /* 進捗サマリー */
    .purpose-input-box {
      margin-bottom: 12px;
      text-align: center;
    }
    .purpose-input-box input {
      width: 90%;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      padding: 8px 10px;
      border: 2px dashed var(--primary);
      border-radius: 8px;
      background: #f0f7ff;
      color: var(--primary);
    }

    .amount-display { text-align: center; margin-bottom: 16px; }
    .amount-label { font-size: 12px; color: var(--text-muted); }
    .amount-value { font-size: 32px; font-weight: 800; color: var(--primary); }
    
    .progress-bar-bg {
      background: #e2e8f0;
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .progress-bar-fill {
      background: linear-gradient(90deg, var(--primary), #3b82f6);
      height: 100%;
      width: 0%;
      transition: width 0.4s ease;
    }
    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-muted);
    }

    .target-setting {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    .target-setting input {
      width: 120px;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      text-align: right;
      font-size: 14px;
      font-weight: 600;
      background: #fafafa;
    }

    /* カスタムタスク */
    .section-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-add {
      background: var(--primary);
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .task-checkbox { width: 20px; height: 20px; accent-color: var(--primary); }
    .task-name-input { flex: 1; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 13px; background: #fafafa; }
    .task-val-input { width: 80px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 13px; text-align: right; background: #fafafa; }
    .btn-del { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 16px; }

    .task-summary-row {
      margin-top: 12px;
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    /* 月別実績エリア */
    .monthly-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .monthly-row input {
      width: 100px;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      text-align: right;
      background: #fafafa;
    }

    /* メモ欄 */
    .memo-area {
      width: 100%;
      height: 100px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
      margin-top: 6px;
      background: #fafafa;
    }

    .footer-note { text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 16px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>資金作成・進捗管理ツール</h1>
  </div>

  <!-- 💡 直感ガイド -->
  <div class="guide-box">
    <div class="guide-title">💡 かんたん3ステップ使い方</div>
    <ul class="guide-steps">
      <li><span class="step-badge">STEP 1</span> 「何費用か」と「目標日・目標額」を入力する</li>
      <li><span class="step-badge">STEP 2</span> タスク（項目）を完了したらチェックを入れる</li>
      <li><span class="step-badge">STEP 3</span> 毎月の実績を入力してグラフで達成度を確認！</li>
    </ul>
  </div>

  <!-- カウントダウン -->
  <div class="card countdown-box">
    <div class="countdown-title">🎯 目標日（期日）まで</div>
    <div class="countdown-days" id="countdownDays">--<span>日</span></div>
    
    <div class="setting-row">
      <label>目標日（期日）:</label>
      <input type="date" id="targetDate" onchange="initTracker()">
    </div>
  </div>

  <!-- 進捗サマリー -->
  <div class="card">
    <div class="purpose-input-box">
      <input type="text" id="purposeTitle" value="遠征・目的費用" placeholder="👆 タップして目的を入力（例：〇〇遠征費用）" onchange="savePurpose()">
    </div>

    <div class="amount-display">
      <div class="amount-label">現在の獲得・達成総額</div>
      <div class="amount-value" id="currentAmount">¥0</div>
    </div>
    
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    
    <div class="progress-info">
      <span>達成率: <strong id="progressPercent" style="color: var(--primary);">0%</strong></span>
      <span>残り必要額: <strong id="remainingAmount">¥0</strong></span>
    </div>

    <div class="target-setting">
      <span>目標達成額：</span>
      <div>
        <input type="number" id="targetAmount" value="50000" step="1000" placeholder="目標金額" onchange="updateAll()"> 円
      </div>
    </div>
  </div>

  <!-- 自由編集タスクリスト -->
  <div class="card">
    <div class="section-title">
      <span>📌 タスク・獲得項目（チェックで加算）</span>
      <button class="btn-add" onclick="addTask()">+ 項目追加</button>
    </div>
    <div id="taskList"></div>
    <div class="task-summary-row">
      <span>チェック済みタスク合計:</span>
      <span id="taskTotalValue" style="color: var(--success);">¥0</span>
    </div>
  </div>

  <!-- 月別実績 ＆ グラフ -->
  <div class="card">
    <div class="section-title">📊 月別実績・推移グラフ（毎月入力）</div>
    <canvas id="monthlyChart" style="max-height: 200px; margin-bottom: 16px;"></canvas>
    <div id="monthlyInputs"></div>
  </div>

  <!-- メモ欄 -->
  <div class="card">
    <div class="section-title">📝 自由メモ欄</div>
    <textarea class="memo-area" id="memoText" placeholder="目標達成に向けたメモ、ポイ活サイトのログイン情報、購入予定のグッズ一覧などご自由にお使いください。" onchange="saveMemo()"></textarea>
  </div>

  <div class="footer-note">
    ※設定・実績・メモは端末内に自動保存されます。<br>
    ホーム画面に追加してアプリ感覚でご活用ください。
  </div>

  <script>
    let chartInstance = null;

    let tasks = [
      { name: "高還元カード発行", val: 12000, checked: false },
      { name: "口座開設・アプリ連携", val: 8000, checked: false },
      { name: "不用品整理・現金化", val: 15000, checked: false }
    ];

    window.onload = function() {
      const savedDate = localStorage.getItem('cfg_target_date');
      const dateInput = document.getElementById('targetDate');
      if (savedDate) {
        dateInput.value = savedDate;
      } else {
        const d = new Date();
        d.setDate(d.getDate() + 90);
        dateInput.value = d.toISOString().split('T')[0];
      }

      const savedPurpose = localStorage.getItem('cfg_purpose');
      if (savedPurpose) document.getElementById('purposeTitle').value = savedPurpose;

      const savedAmount = localStorage.getItem('cfg_target_amount');
      if (savedAmount) document.getElementById('targetAmount').value = savedAmount;

      const savedMemo = localStorage.getItem('cfg_memo');
      if (savedMemo) document.getElementById('memoText').value = savedMemo;

      const savedTasks = localStorage.getItem('cfg_tasks');
      if (savedTasks) tasks = JSON.parse(savedTasks);

      renderTasks();
      initTracker();
    };

    function savePurpose() {
      const val = document.getElementById('purposeTitle').value;
      localStorage.setItem('cfg_purpose', val);
    }

    function saveMemo() {
      const val = document.getElementById('memoText').value;
      localStorage.setItem('cfg_memo', val);
    }

    function renderTasks() {
      const container = document.getElementById('taskList');
      container.innerHTML = '';

      tasks.forEach((t, i) => {
        const div = document.createElement('div');
        div.className = 'task-item';
        div.innerHTML = `
          <input type="checkbox" class="task-checkbox" ${t.checked ? 'checked' : ''} onchange="toggleTask(${i})">
          <input type="text" class="task-name-input" value="${t.name}" placeholder="タスク名" onchange="updateTaskName(${i}, this.value)">
          <input type="number" class="task-val-input" value="${t.val}" placeholder="金額" onchange="updateTaskVal(${i}, this.value)"> 円
          <button class="btn-del" onclick="delTask(${i})">✕</button>
        `;
        container.appendChild(div);
      });
      updateAll();
    }

    function addTask() {
      tasks.push({ name: "新規タスク", val: 5000, checked: false });
      renderTasks();
    }

    function delTask(i) {
      tasks.splice(i, 1);
      renderTasks();
    }

    function toggleTask(i) { tasks[i].checked = !tasks[i].checked; updateAll(); }
    function updateTaskName(i, val) { tasks[i].name = val; saveTasks(); }
    function updateTaskVal(i, val) { tasks[i].val = parseInt(val) || 0; updateAll(); }
    function saveTasks() { localStorage.setItem('cfg_tasks', JSON.stringify(tasks)); }

    function initTracker() {
      const targetDateVal = document.getElementById('targetDate').value;
      localStorage.setItem('cfg_target_date', targetDateVal);

      if (!targetDateVal) return;

      const targetDate = new Date(targetDateVal);
      const today = new Date();

      const diffTime = targetDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      document.getElementById('countdownDays').innerHTML = (diffDays < 0 ? '終了' : diffDays) + '<span>日</span>';

      const months = [];
      let cur = new Date(today.getFullYear(), today.getMonth() - 1, 1);
      const end = new Date(targetDate.getFullYear(), targetDate.getMonth() + 1, 1);

      while (cur < end) {
        const mKey = `${cur.getFullYear()}年${cur.getMonth() + 1}月度`;
        months.push(mKey);
        cur.setMonth(cur.getMonth() + 1);
      }

      const container = document.getElementById('monthlyInputs');
      container.innerHTML = '';

      const savedMonthly = JSON.parse(localStorage.getItem('cfg_monthly') || '{}');

      months.forEach(m => {
        const val = savedMonthly[m] || 0;
        const div = document.createElement('div');
        div.className = 'monthly-row';
        div.innerHTML = `
          <span>${m}</span>
          <div><input type="number" class="monthly-val" data-month="${m}" value="${val}" placeholder="0" onchange="saveMonthly()"> 円</div>
        `;
        container.appendChild(div);
      });

      updateAll();
    }

    function saveMonthly() {
      const inputs = document.querySelectorAll('.monthly-val');
      const data = {};
      inputs.forEach(input => {
        data[input.getAttribute('data-month')] = parseInt(input.value) || 0;
      });
      localStorage.setItem('cfg_monthly', JSON.stringify(data));
      updateAll();
    }

    function updateAll() {
      saveTasks();
      
      const targetInput = document.getElementById('targetAmount');
      const targetTotal = parseInt(targetInput.value) || 1;
      localStorage.setItem('cfg_target_amount', targetTotal);

      let taskTotal = 0;
      tasks.forEach(t => { if (t.checked) taskTotal += t.val; });
      document.getElementById('taskTotalValue').innerText = '¥' + taskTotal.toLocaleString();

      let monthlyTotal = 0;
      const monthlyData = JSON.parse(localStorage.getItem('cfg_monthly') || '{}');
      Object.values(monthlyData).forEach(v => monthlyTotal += parseInt(v) || 0);

      const currentTotal = taskTotal + monthlyTotal;

      document.getElementById('currentAmount').innerText = '¥' + currentTotal.toLocaleString();
      
      const remaining = Math.max(0, targetTotal - currentTotal);
      document.getElementById('remainingAmount').innerText = '¥' + remaining.toLocaleString();

      const percentage = Math.min(Math.round((currentTotal / targetTotal) * 100), 100);
      document.getElementById('progressFill').style.width = percentage + '%';
      document.getElementById('progressPercent').innerText = percentage + '%';

      renderChart(monthlyData);
    }

    function renderChart(monthlyData) {
      const ctx = document.getElementById('monthlyChart').getContext('2d');
      const labels = Object.keys(monthlyData);
      const values = Object.values(monthlyData);

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: '月別獲得額 (円)',
            data: values,
            backgroundColor: '#2563eb',
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, grid: { color: '#f1f5f9' } },
            x: { grid: { display: false } }
          }
        }
      });
    }
  </script>
</body>
</html>
